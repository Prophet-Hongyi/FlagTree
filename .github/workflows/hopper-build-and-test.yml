name: Hopper3.6-Build-And-Test

on:
  schedule:
    - cron: '0 21 * * *'
  push:
    branches: [ "triton_v3.6.x" ]
  pull_request:
    branches: [ "triton_v3.6.x" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  hopper-build-and-test:
    runs-on: hopper
    if: ${{ github.repository == 'FlagTree/flagtree' || github.repository == 'flagos-ai/flagtree' }}
    steps:
      - name: Setup environment
        shell: bash
        run: |
          source ~/env.sh
          env | grep -E '^(http_proxy|https_proxy|all_proxy|no_proxy)=' >> $GITHUB_ENV || true

      - name: Smart Checkout
        uses: flagos-ai/FlagTree/.github/actions/smart-checkout@main
        with:
          checkout_version: 'v6'

      - name: Check if backend-relevant files changed
        id: check_backend
        uses: flagos-ai/FlagTree/.github/actions/check-backend-changed@main
        with:
          backend: nvidia

      - name: Detect Target Branch
        shell: bash
        run: |
          set -x
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            TARGET_BRANCH="${{ github.base_ref }}"
          else
            TARGET_BRANCH="${{ github.ref_name }}"
          fi
          echo "TARGET_BRANCH=$TARGET_BRANCH" >> $GITHUB_ENV
          echo "TARGET_BRANCH=$TARGET_BRANCH"

      - name: FlagTree Build on NVidia (triton_v3.6.x branch)
        if: ${{ steps.check_backend.outputs.should_skip != 'true' && env.TARGET_BRANCH == 'triton_v3.6.x' }}
        shell: bash
        run: |
          set -x
          # Reproduce the original PR #760 attempt-3 merge commit that hit
          # cluster-gemm misaligned address before the base branch moved.
          git fetch origin dd79a2328a578057bd9dc8e0a1a2f6351bbf635a
          git checkout --force FETCH_HEAD
          git clean -ffdx
          git log -1 --format='%H %s'
          pip uninstall -y triton
          rm -rf ~/.triton/cache
          source ~/env-3.6.sh
          env | grep -E '^(LLVM_SYSPATH)=' >> $GITHUB_ENV || true
          export USE_FLAGCX=ON
          MAX_JOBS=32 python3 -m pip install . --no-build-isolation

      - name: FlagTree Test on NVidia (triton_v3.6.x branch)
        if: ${{ steps.check_backend.outputs.should_skip != 'true' && env.TARGET_BRANCH == 'triton_v3.6.x' }}
        shell: bash
        run: |
          set -x
          source ~/env.sh
          git log -1 --format='[debug] workspace commit %H %s'
          rm -rf ~/.triton/cache
          python3 - <<'PY'
          import importlib.util
          import pathlib
          import sys

          import torch

          path = pathlib.Path("python/tutorials/tle/04-cluster-gemm.py")
          spec = importlib.util.spec_from_file_location("cluster_gemm_debug", path)
          mod = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = mod
          spec.loader.exec_module(mod)

          skip_reason = mod._cluster_remote_support_skip_reason()
          if skip_reason is not None:
              print(f"SKIP: {skip_reason}", flush=True)
              raise SystemExit(0)

          M = N = K = 4096
          torch.manual_seed(0)
          a = torch.randn((M, K), device="cuda", dtype=torch.float16)
          b = torch.randn((K, N), device="cuda", dtype=torch.float16)
          c_triton = torch.empty((M, N), device="cuda", dtype=torch.float16)
          c_remote = torch.empty_like(c_triton)
          print(
              f"[debug] ptr mod256 a={a.data_ptr() % 256} "
              f"b={b.data_ptr() % 256} c={c_remote.data_ptr() % 256}",
              flush=True,
          )

          progress = pathlib.Path("/tmp/cluster-gemm-candidate.txt")

          def run_triton_case(idx, cfg):
              progress.write_text(f"triton {idx}: {cfg}\n")
              print(f"[debug] running triton {idx}: {cfg}", flush=True)
              mod._run_triton(a, b, c_triton, cfg.bm, cfg.bn, cfg.bk, cfg.num_warps, cfg.num_stages)
              torch.cuda.synchronize()
              ms = mod.triton.testing.do_bench(
                  lambda: mod._run_triton(
                      a,
                      b,
                      c_triton,
                      cfg.bm,
                      cfg.bn,
                      cfg.bk,
                      cfg.num_warps,
                      cfg.num_stages,
                  ),
                  warmup=10,
                  rep=30,
              )
              torch.cuda.synchronize()
              progress.write_text(f"triton {idx}: {cfg} PASS ms={ms}\n")
              print(f"[debug] triton {idx}: PASS ms={ms}", flush=True)

          def run_case(name, cfg):
              progress.write_text(f"{name}: {cfg}\n")
              print(f"[debug] running {name}: {cfg}", flush=True)
              mod._run_cluster_remote(a, b, c_remote, cfg.bm, cfg.bn, cfg.bk, cfg.num_warps, cfg.num_stages)
              torch.cuda.synchronize()
              ms = mod.triton.testing.do_bench(
                  lambda: mod._run_cluster_remote(
                      a,
                      b,
                      c_remote,
                      cfg.bm,
                      cfg.bn,
                      cfg.bk,
                      cfg.num_warps,
                      cfg.num_stages,
                  ),
                  warmup=10,
                  rep=30,
              )
              torch.cuda.synchronize()
              progress.write_text(f"{name}: {cfg} PASS ms={ms}\n")
              print(f"[debug] {name}: PASS ms={ms}", flush=True)

          try:
              for idx, cfg in enumerate(mod.TRITON_TUNE_CONFIGS):
                  run_triton_case(idx, cfg)
              for idx, cfg in enumerate(mod.REMOTE_TUNE_CONFIGS):
                  run_case(f"remote_candidate_{idx}", cfg)
          except BaseException:
              print("[debug] last cluster-gemm candidate:", flush=True)
              print(progress.read_text(), flush=True)
              raise
          PY
