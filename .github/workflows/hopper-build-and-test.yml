name: Hopper3.6-Build-And-Test

on:
  schedule:
    - cron: '0 21 * * *'
  push:
    branches: [ "triton_v3.6.x" ]
  pull_request:
    branches: [ "triton_v3.6.x" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  hopper-build-and-test:
    runs-on: hopper
    if: ${{ github.repository == 'FlagTree/flagtree' || github.repository == 'flagos-ai/flagtree' }}
    steps:
      - name: Setup environment
        shell: bash
        run: |
          source ~/env.sh
          env | grep -E '^(http_proxy|https_proxy|all_proxy|no_proxy)=' >> $GITHUB_ENV || true

      - name: Smart Checkout
        uses: flagos-ai/FlagTree/.github/actions/smart-checkout@main
        with:
          checkout_version: 'v6'

      - name: Check if backend-relevant files changed
        id: check_backend
        uses: flagos-ai/FlagTree/.github/actions/check-backend-changed@main
        with:
          backend: nvidia

      - name: Detect Target Branch
        shell: bash
        run: |
          set -x
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            TARGET_BRANCH="${{ github.base_ref }}"
          else
            TARGET_BRANCH="${{ github.ref_name }}"
          fi
          echo "TARGET_BRANCH=$TARGET_BRANCH" >> $GITHUB_ENV
          echo "TARGET_BRANCH=$TARGET_BRANCH"

      - name: FlagTree Build on NVidia (triton_v3.6.x branch)
        if: ${{ steps.check_backend.outputs.should_skip != 'true' && env.TARGET_BRANCH == 'triton_v3.6.x' }}
        shell: bash
        run: |
          set -x
          # Reproduce the original PR #760 attempt-3 merge commit that hit
          # cluster-gemm misaligned address before the base branch moved.
          git fetch origin dd79a2328a578057bd9dc8e0a1a2f6351bbf635a
          git checkout --force FETCH_HEAD
          git clean -ffdx
          git log -1 --format='%H %s'
          pip uninstall -y triton
          source ~/env-3.6.sh
          env | grep -E '^(LLVM_SYSPATH)=' >> $GITHUB_ENV || true
          rm -rf ~/.triton/cache
          USE_FLAGCX=ON MAX_JOBS=32 python3 -m pip install . --no-build-isolation

      - name: FlagTree Test on NVidia (triton_v3.6.x branch)
        if: ${{ steps.check_backend.outputs.should_skip != 'true' && env.TARGET_BRANCH == 'triton_v3.6.x' }}
        shell: bash
        run: |
          set -x
          source ~/env.sh
          git log -1 --format='[debug] workspace commit %H %s'
          echo "[debug] runner=${RUNNER_NAME:-unset} cuda_visible=${CUDA_VISIBLE_DEVICES:-unset}"
          nvidia-smi --query-gpu=index,name,uuid,memory.used,memory.total --format=csv || true
          # Re-run the same CI prefix that completed before the original
          # PR #760 attempt-3 cluster-gemm failure.
          python3 python/tutorials/01-vector-add.py --only_unit_test
          python3 python/tutorials/02-fused-softmax.py --only_unit_test
          python3 python/tutorials/03-matrix-multiplication.py --only_unit_test
          python3 python/tutorials/04-low-memory-dropout.py --only_unit_test
          python3 python/tutorials/05-layer-norm.py --only_unit_test
          python3 python/tutorials/06-fused-attention.py --only_unit_test
          python3 python/tutorials/07-extern-functions.py --only_unit_test
          python3 python/tutorials/08-grouped-gemm.py --only_unit_test
          python3 python/tutorials/09-persistent-matmul.py --only_unit_test
          python3 python/tutorials/11-programmatic-dependent-launch.py --only_unit_test
          python3 -m pytest -s python/test/unit/cuda
          python3 -m pytest -s python/test/unit/instrumentation
          python3 -m pytest -s python/test/unit/language \
              --ignore=python/test/unit/language/test_line_info.py
          python3 -m pytest -s python/test/unit/runtime
          if [ -d "python/test/operators" ]; then
            python3 -m pytest -s python/test/operators
          fi
          python3 python/tutorials/tle/01-fft.py
          python3 python/tutorials/tle/02-moe_align_block_size.py
          python3 python/tutorials/tle/03-topk.py
          echo "[debug] triton cache before cluster-gemm"
          du -sh ~/.triton/cache || true
          find ~/.triton/cache -type f 2>/dev/null | wc -l || true
          for trial in $(seq 1 200); do
            echo "[debug] cluster-gemm trial ${trial}/200"
            CLUSTER_GEMM_TRIAL="${trial}" python3 - <<'PY'
          import importlib.util
          import os
          import pathlib
          import sys

          import torch

          path = pathlib.Path("python/tutorials/tle/04-cluster-gemm.py")
          spec = importlib.util.spec_from_file_location("cluster_gemm_debug", path)
          mod = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = mod
          spec.loader.exec_module(mod)

          trial = os.environ.get("CLUSTER_GEMM_TRIAL", "?")
          progress = pathlib.Path(f"/tmp/cluster-gemm-candidate-{trial}.txt")

          def logged_autotune(name, candidates, run_fn, M, N, K, warmup, rep):
              best_cfg = candidates[0]
              best_ms = float("inf")
              for idx, cfg in enumerate(candidates):
                  progress.write_text(f"trial {trial} {name} candidate_{idx}: {cfg}\n")
                  print(f"[debug] trial {trial} running {name} candidate_{idx}: {cfg}", flush=True)
                  run_fn(cfg)
                  torch.cuda.synchronize()
                  ms = mod.triton.testing.do_bench(
                      lambda: run_fn(cfg),
                      warmup=warmup,
                      rep=rep,
                  )
                  progress.write_text(f"trial {trial} {name} candidate_{idx}: {cfg} PASS ms={ms}\n")
                  print(f"[debug] trial {trial} {name} candidate_{idx}: PASS ms={ms}", flush=True)
                  if ms < best_ms:
                      best_ms = ms
                      best_cfg = cfg
              print(
                  f"[autotune] {name}: best cfg={best_cfg} "
                  f"ms={best_ms:.3f} tflops={mod._tflops(M, N, K, best_ms):.2f}"
              )
              return best_cfg

          mod._autotune_config = logged_autotune

          try:
              print(f"[debug] cluster-gemm trial {trial} start", flush=True)
              mod.main([])
          except BaseException:
              print("[debug] last cluster-gemm candidate:", flush=True)
              if progress.exists():
                  print(progress.read_text(), flush=True)
              raise
          PY
          done
