name: CD-Iluvatar3.1

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      WHL_VER:
        description: '0.6.0.dev1 < 0.6.0a1 < 0.6.0b1 < 0.6.0rc1 < 0.6.0 < 0.6.0.post1'
        required: true
        default: '0.6.0'
      PYTHON_VER:
        required: true
        default: '3.12'
      PLATFORM:
        required: true
        default: 'x86_64'
      BRANCH:
        required: true
        default: 'triton_v3.1.x'
      TRITON:
        required: true
        default: '3.1'
      BACKEND:
        required: true
        default: 'iluvatar'
      FLAGTREE_PYPI_KEY:
        required: false
  workflow_call:
    inputs:
      WHL_VER:
        type: string
        required: true
        default: '0.6.0'
      PYTHON_VER:
        type: string
        required: true
        default: '3.12'
      PLATFORM:
        type: string
        required: true
        default: 'x86_64'
      BRANCH:
        type: string
        required: true
        default: 'triton_v3.1.x'
      TRITON:
        type: string
        required: true
        default: '3.1'
      BACKEND:
        type: string
        required: true
        default: 'iluvatar'
      FLAGTREE_PYPI_KEY:
        type: string
        required: false

jobs:
  call-delivery:
    uses: flagos-ai/flagtree/.github/workflows/iluvatar3.1-delivery.yml@main
    with:
      WHL_VER: ${{ inputs.WHL_VER }}
      PYTHON_VER: ${{ inputs.PYTHON_VER }}
      PLATFORM: ${{ inputs.PLATFORM }}
      BRANCH: ${{ inputs.BRANCH }}
      TRITON: ${{ inputs.TRITON }}
      BACKEND: ${{ inputs.BACKEND }}
      FLAGTREE_PYPI_KEY: ${{ inputs.FLAGTREE_PYPI_KEY }}
    secrets: inherit
